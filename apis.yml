aid: wacai
name: wacai
description: >-
  Wacai (挖财, Hangzhou Wacai Network Technology Co., Ltd.) is a Chinese fintech and
  personal-finance company founded in 2009, best known for its "挖财记账" personal
  accounting and bookkeeping app and its internet wealth-management platform. Beyond
  its consumer apps, Wacai operates a partner-facing open API gateway (挖财开放平台) at
  open.wacai.com that exposes services through a single JSON-over-HTTPS entry point
  using appKey/appSecret signed requests, with official client SDKs published for
  Java (Maven Central), Node.js, PHP, Go, and C#. It was surfaced as a portfolio
  company of Qiming Venture Partners.
